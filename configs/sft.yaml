# SFT stage config. `frozen:` is SPEC (asserted against studio/stages/sft.py).
# The agent edits `data:` ONLY (which gated dataset, mix ratios, epochs).

frozen:
  loss: cross_entropy
  optimizer: adamw_8bit
  schedule: cosine
  max_seq_len: 2048
  learning_rate: 2.0e-4
  peft: {kind: lora, r: 16, alpha: 32, dropout: 0.0}

data:                       # ← the one movable knob (judge-gated data recipe)
  sources:
    - {dataset: auto, weight: 1}       # judge-gated demos from build_data.py
  epochs: 2

run:
  experiment: agentic-cpt
  base_model: unsloth/Qwen3.5-0.8B
  init_from: experiments/agentic-cpt/outputs/cpt
  stage: sft
  metric: corpus_probes_dev
  seed: 3407
  max_minutes: 30
  per_device_batch: 4
  grad_accum: 4
