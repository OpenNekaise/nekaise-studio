# OPD stage config — sampled-token on-policy distillation (TRL GKDTrainer).
# `frozen:` is asserted against studio/stages/opd.py. The agent edits `data:` ONLY —
# and the knob here is TEACHER CHOICE.

frozen:
  algo: gkd
  lmbda: 1.0
  beta: 0.5
  seq_kd: false
  top_k: null
  learning_rate: 1.0e-6
  schedule: constant
  temperature: 1.0
  peft: {kind: lora, r: 32, alpha: 64, dropout: 0.0}

data:                       # ← the one movable knob (teacher choice + prompt set)
  teacher: experiments/agentic-cpt/outputs/rlvr    # own post-RL checkpoint (self-distill)
  tasks:
    - {set: corpus_probes, split: dev, n: 500}

run:
  experiment: agentic-cpt
  init_from: experiments/agentic-cpt/outputs/sft
  stage: opd
  metric: kd_loss
  seed: 3407
  max_minutes: 60
  per_device_batch: 2
  grad_accum: 8
  max_steps: 500
