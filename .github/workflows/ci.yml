name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install control plane and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Python integration tests
        run: python -m pytest
      - name: Dashboard tests and syntax
        run: |
          node --test dashboard/tests/*.test.js
          node --check dashboard/dist/app.js
          node --check dashboard/dist/views.js
          node --check dashboard/dist/lib.js
      - name: Check lightweight API imports
        run: |
          python - <<'PY'
          import sys
          import nekaise_loop.api
          assert 'torch' not in sys.modules and 'transformers' not in sys.modules
          PY
