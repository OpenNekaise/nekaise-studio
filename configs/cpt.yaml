# CPT stage config. `frozen:` is SPEC (asserted against studio/stages/cpt.py — drift
# refuses to run). The agent edits `data:` ONLY (domain/replay mix, annealing subset).
# `run:` is operational (experiment name, budget, batch geometry) — not a search space.

frozen:
  optimizer: adamw_8bit
  schedule: wsd
  warmup_ratio: 0.03
  decay_ratio: 0.10
  max_seq_len: 2048
  learning_rate: 2.0e-5
  precision: bf16
  finetuning: full

data:                       # ← the one movable knob (data recipe)
  corpus:
    path: ../nekaise-corpus
    target_content_tokens: 40000000
    max_document_content_tokens: 262144
    document_slice_tokens: 8192
    max_content_tokens: 1800
    min_source_chars: 1500
    min_clean_chars: 1500
    selection_seed: 3407
    stream_plan: nekaise-1b-cpt-v1
  sources:
    - {dataset: auto, weight: 1}       # datakit LATEST from build_data.py
  epochs: 1

run:
  experiment: cpt
  base_model: openbmb/MiniCPM5-1B-Base
  init_from: null
  stage: cpt
  kind: data_scale
  seed: 3407
  max_minutes: 120
  per_device_batch: 2
  grad_accum: 8
  preprocess_workers: 4
