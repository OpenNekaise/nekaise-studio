# RLVR stage config — JustRL verbatim (SPEC.md Appendix A). `frozen:` is asserted
# against studio/stages/rlvr.py; ALL hyperparameters are frozen (no search).
# The agent edits `data:` ONLY: task-set composition + verifier binding.

frozen:
  algo: grpo
  learning_rate: 1.0e-6
  schedule: constant
  num_generations: 8
  temperature: 1.0
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.0
  entropy_regularization: false
  effective_prompts_per_step: 256
  reward: binary_verifier
  stabilizer: clip_higher_only
  rollout_engine: vllm
  peft: {kind: lora, r: 32, alpha: 64, dropout: 0.0}

data:                       # ← the one movable knob (task-set composition)
  tasks:
    - {set: corpus_probes, split: dev, n: 0, trainable_filter: true}

run:
  experiment: agentic-cpt
  init_from: experiments/agentic-cpt/outputs/sft
  stage: rlvr
  metric: reward
  seed: 3407
  max_minutes: 120
  per_device_completions: 8
  max_prompt_length: 1024
  max_completion_length: 256      # task-window param (short answers), not stability
  max_steps: 1000
