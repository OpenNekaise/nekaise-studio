# Agentic stage config — trajectory rejection SFT → short-horizon GRPO (outcome reward).
# `frozen:` is asserted against studio/stages/agentic. The agent edits `data:` ONLY
# (task-set composition). Steps hard-capped; process rewards banned by the card.

frozen:
  max_steps: 15
  reward: outcome_only
  process_rewards: false
  dense_supervision: false

data:                       # ← the one movable knob (task-set composition)
  tasks:
    - {set: toy_agentic, split: dev, n: 8}

run:
  experiment: agentic-cpt
  stage: agentic
  seed: 3407
  max_minutes: 60
